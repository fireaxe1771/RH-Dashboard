name: Build & Deploy to Azure Container Apps

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  # Job 1: Run Full Test Suites (Fail Loudly if any test fails)
  test:
    name: Run Unit & Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      # Backend Testing
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          cd backend
          pytest -v

      # Frontend Testing
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Vitest
        run: |
          cd frontend
          npm run test

  # Job 2: Build Images, Push to ACR, and Deploy via Terraform
  deploy:
    name: Build, Push, and Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      # Login to Azure using OIDC federated identity (no long-lived client secret).
      # Requires `permissions: id-token: write` (set at the top of this file) and
      # a federated credential on the Azure AD App Registration trusting this repo.
      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Login to Azure Container Registry (ACR)
      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      # Build and Push Backend Docker Image
      - name: Build & Push Backend Image
        run: |
          docker build \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/rh-dashboard-backend:${{ github.sha }} \
            ./backend
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/rh-dashboard-backend:${{ github.sha }}

      # Build and Push Frontend Docker Image (injecting Entra client IDs)
      # The frontend client ID is a PUBLIC value (baked into browser-visible JS,
      # visible to every site visitor). It is the Entra ID SPA app registration
      # used for MSAL user login — separate from the deploy service principal.
      # It is sourced from the AZURE_SPA_CLIENT_ID GitHub secret so there is a
      # single source of truth shared with the backend's JWT audience (via
      # TF_VAR_azure_spa_client_id below).
      - name: Build & Push Frontend Image
        run: |
          docker build \
            --build-arg VITE_AZURE_CLIENT_ID=${{ secrets['AZURE_SPA_CLIENT_ID'] }} \
            --build-arg VITE_AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }} \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/rh-dashboard-frontend:${{ github.sha }} \
            ./frontend
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/rh-dashboard-frontend:${{ github.sha }}

      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.2

      # Initialize and Apply Infrastructure via Terraform
      - name: Terraform Init & Apply
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve
        env:
          # Authenticate to the Terraform state backend (Azure Storage) via OIDC
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          # Inject secrets as Terraform variables (TF_VAR_ prefix)
          TF_VAR_resource_group_name: ${{ secrets.AZURE_RESOURCE_GROUP }}
          TF_VAR_acr_name: ${{ secrets.ACR_NAME }}
          TF_VAR_backend_image_tag: ${{ github.sha }}
          TF_VAR_frontend_image_tag: ${{ github.sha }}
          TF_VAR_mongodb_uri: ${{ secrets.MONGODB_URI }}
          TF_VAR_mongodb_db_name: ${{ secrets['MONGODB_DB_NAME'] || 'recoveryhub_dashboard' }}
          TF_VAR_recoveryhub_ai_mongodb_db_name: AI_FEE_CALC_MULTI_AGENT_PROD
          TF_VAR_azure_sql_host: ${{ secrets.AZURE_SQL_HOST }}
          TF_VAR_azure_sql_db: ${{ secrets.AZURE_SQL_DB }}
          TF_VAR_azure_sql_user: ${{ secrets.AZURE_SQL_USER }}
          TF_VAR_azure_sql_password: ${{ secrets.AZURE_SQL_PASSWORD }}
          TF_VAR_azure_sql_authentication: azure-ad
          TF_VAR_azure_sql_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          TF_VAR_azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          # SPA client ID (single source of truth): the frontend build arg
          # VITE_AZURE_CLIENT_ID and the backend's AZURE_CLIENT_ID (JWT
          # audience) both derive from this secret.
          TF_VAR_azure_spa_client_id: ${{ secrets['AZURE_SPA_CLIENT_ID'] }}
          # Frontend origin used by the backend to restrict CORS.
          TF_VAR_frontend_url: ${{ secrets['FRONTEND_URL'] }}
          # Billing integration secrets
          TF_VAR_azure_billing_client_id: ${{ secrets['AZURE_BILLING_CLIENT_ID'] }}
          TF_VAR_azure_billing_client_secret: ${{ secrets['AZURE_BILLING_CLIENT_SECRET'] }}
          TF_VAR_azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_azure_billing_account_id: ${{ secrets['AZURE_BILLING_ACCOUNT_ID'] }}
          TF_VAR_azure_billing_account_type: ${{ secrets['AZURE_BILLING_ACCOUNT_TYPE'] }}
          TF_VAR_azure_management_group_id: ${{ secrets['AZURE_MANAGEMENT_GROUP_ID'] }}
          # AI integration secrets (Azure OpenAI / Foundry; OpenAI.com optional).
          # API version and chat/embedding deployment names use the Terraform
          # defaults (2024-10-21, gpt-5.4-mini, text-embedding-3-small); override
          # them in terraform/billing_variables.tf if your deployments differ.
          TF_VAR_openai_api_key: ${{ secrets['OPENAI_API_KEY'] }}
          TF_VAR_azure_openai_endpoint: ${{ secrets['AZURE_OPENAI_ENDPOINT'] }}
          TF_VAR_azure_openai_api_key: ${{ secrets['AZURE_OPENAI_API_KEY'] }}
